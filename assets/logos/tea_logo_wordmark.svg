  <!-- Right: Neo-Brutalist Block Letters "TEA" with individual drop shadows -->
  <g transform="translate(195, 12)">

    <!-- LETTER T -->
    <g>
      <!-- Shadow -->
      <path d="M 6 16 L 62 16 L 62 34 L 44 34 L 44 84 L 24 84 L 24 34 L 6 34 Z" fill="#020202"/>
      <!-- Face -->
      <path d="M 0 10 L 56 10 L 56 28 L 38 28 L 38 78 L 18 78 L 18 28 L 0 28 Z" 
            fill="#FFFFFF" stroke="#020202" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- LETTER E -->
    <g transform="translate(68, 0)">
      <!-- Shadow -->
      <path d="M 6 16 L 56 16 L 56 34 L 26 34 L 26 42 L 50 42 L 50 56 L 26 56 L 26 66 L 58 66 L 58 84 L 6 84 Z" fill="#020202"/>
      <!-- Face -->
      <path d="M 0 10 L 50 10 L 50 28 L 20 28 L 20 36 L 44 36 L 44 50 L 20 50 L 20 60 L 52 60 L 52 78 L 0 78 Z" 
            fill="#FFFFFF" stroke="#020202" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- LETTER A -->
    <g transform="translate(132, 0)">
      <!-- Shadow -->
      <path d="M 6 84 L 28 16 L 48 16 L 70 84 L 50 84 L 45 66 L 29 66 L 24 84 Z M 32 50 L 42 50 L 37 32 Z" fill="#020202"/>
      <!-- Face -->
      <path d="M 0 78 L 22 10 L 42 10 L 64 78 L 44 78 L 39 60 L 23 60 L 18 78 Z M 26 44 L 36 44 L 31 26 Z" 
            fill="#FFFFFF" stroke="#020202" stroke-width="5" stroke-linejoin="round"/>
      <!-- Little heart accent floating above the A -->
      <path d="M 52 -2 C 48 -6, 40 -4, 40 2 C 40 6, 48 12, 52 16 C 56 12, 64 6, 64 2 C 64 -4, 56 -6, 52 -2 Z" 
            fill="#EF476F" stroke="#020202" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- SUBTITLE PILL: Full width "DATING ADVICE" -->
    <g transform="translate(0, 96)">
      <!-- Hard Shadow -->
      <rect x="5" y="5" width="295" height="38" rx="8" fill="#020202"/>
      <!-- Pill (Mint Accent) -->
      <rect x="0" y="0" width="295" height="38" rx="8" fill="#73BDA8" stroke="#020202" stroke-width="4"/>
      
      <!-- Flag vector icon left -->
      <path d="M 18 13 L 30 18 L 18 23 Z" fill="#D72A2A" stroke="#020202" stroke-width="2"/>
      <line x1="18" y1="13" x2="18" y2="28" stroke="#020202" stroke-width="2.5" stroke-linecap="round"/>

      <text x="156" y="25" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" 
            text-anchor="middle" fill="#020202" letter-spacing="3">DATING ADVICE</text>

      <!-- Green heart vector right -->
      <path d="M 276 15 C 274 12, 270 13, 270 16 C 270 19, 276 24, 276 24 C 276 24, 282 19, 282 16 C 282 13, 278 12, 276 15 Z" 
            fill="#06D6A0" stroke="#020202" stroke-width="2"/>
    </g>

